services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/hermes:/opt/data
      - /data/documents:/opt/documents:ro
      - hermes-state:/root/.local/state/hermes
    env_file:
      - .env
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[g]ateway run' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - /data/hermes:/opt/data
    env_file:
      - .env
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[d]ashboard' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  hermes-state:
